services:
  # -------------------------------------------------------------
  # MySQL Database Service
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: careerprepster-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: careerprepster
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-prootpassword']
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------
  # Express Backend API Service
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerprepster-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: development
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/careerprepster
      CLIENT_URL: http://localhost:3000
      JWT_SECRET: super-secret-jwt-key-for-development-mode-only
      JWT_EXPIRES_IN: 7d
      GEMINI_API_KEY: ${GEMINI_API_KEY:-AQ.Ab8RN6Iy6mRLxxlTkbT5gabr-sg3jw8n_X4WWcCNeGmfVJIcLQ}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules



volumes:
  mysql_data:
    driver: local
