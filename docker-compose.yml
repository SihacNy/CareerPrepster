services:
  # -------------------------------------------------------------
  # MySQL Database Service
  # -------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: careerprepster-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: careerprepster
    ports:
      - '${MYSQL_PORT}:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-prootpassword']
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------
  # Express Backend API Service
  # -------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: careerprepster-backend
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: ${PORT:-5000}
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: mysql://root:rootpassword@mysql:3306/careerprepster
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-key-for-development-mode-only}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-1.5-flash}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 500
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./shared:/app/shared
      - ./backend:/app/backend
      - /app/node_modules
      - /app/backend/node_modules

  # -------------------------------------------------------------
  # Next.js Frontend Web Application Service
  # -------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: careerprepster-frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      INTERNAL_API_URL: http://backend:5000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID}}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      NEXT_IGNORE_INCORRECT_LOCKFILE: "1"
    depends_on:
      - backend
    volumes:
      - ./shared:/app/shared
      - ./frontend:/app/frontend
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/frontend/.next

volumes:
  mysql_data:
    driver: local
